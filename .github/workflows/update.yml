name: Update schedule

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Parse schedule
        run: |
          python scripts/parse_schedule.py \
            --url "${{ vars.SCHEDULE_XLSX_URL }}" \
            --out docs/schedule.json

      - name: Build ICS
        run: python scripts/make_ics.py --in docs/schedule.json --out docs/schedule.ics

      - name: Commit changes if any
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/schedule.json docs/schedule.ics
          git diff --cached --quiet || git commit -m "Auto-update schedule"
          git push
