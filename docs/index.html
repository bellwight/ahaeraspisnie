<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание группы</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f7f7f9; --card:#ffffff; --text:#1c1c1e; --muted:#6b6b70;
    --accent:#3b5bfd; --border:#e4e4e8; --today:#eef1ff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101014; --card:#1b1b20; --text:#f0f0f2; --muted:#9a9aa2; --border:#2c2c33; --today:#1c2140; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header{ padding:20px 16px 8px; }
  h1{ font-size:1.25rem; margin:0 0 2px; }
  .group{ color:var(--accent); font-weight:600; }
  .meta{ color:var(--muted); font-size:0.85rem; margin-top:4px; }
  .links{ display:flex; gap:8px; flex-wrap:wrap; padding:8px 16px 4px; }
  .links a{
    display:inline-block; padding:8px 14px; border-radius:10px; background:var(--card);
    border:1px solid var(--border); color:var(--text); text-decoration:none; font-size:0.9rem;
  }
  main{ padding:8px 16px 40px; max-width:720px; margin:0 auto; }
  .day{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    margin:14px 0; overflow:hidden;
  }
  .day.today{ border-color:var(--accent); }
  .day-head{
    padding:10px 14px; font-weight:600; display:flex; justify-content:space-between; align-items:baseline;
    background:var(--today);
  }
  .day:not(.today) .day-head{ background:transparent; border-bottom:1px solid var(--border); }
  .day-head .wd{ color:var(--muted); font-weight:500; font-size:0.85rem; }
  .lesson{ padding:10px 14px; display:flex; gap:12px; border-top:1px solid var(--border); }
  .lesson:first-of-type{ border-top:none; }
  .time{ flex:0 0 84px; color:var(--accent); font-weight:600; font-size:0.9rem; white-space:nowrap; }
  .info .subj{ font-weight:500; }
  .info .sub{ color:var(--muted); font-size:0.85rem; margin-top:2px; }
  .empty-day{ padding:14px; color:var(--muted); font-size:0.9rem; }
  .placeholder{ padding:40px 16px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Расписание пар — <span class="group" id="groupName">…</span></h1>
  <div class="meta" id="meta">загрузка…</div>
</header>
<div class="links">
  <a id="icsLink" href="schedule.ics">📅 Подписаться на календарь (.ics)</a>
  <a id="jsonLink" href="schedule.json">JSON</a>
</div>
<main id="main">
  <div class="placeholder">Загружаю расписание…</div>
</main>

<script>
const WEEKDAYS = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return { label: `${d} ${MONTHS[m-1]}`, weekday: WEEKDAYS[dt.getDay()], dow: dt.getDay(), dateObj: dt };
}

function todayIso(){
  const now = new Date();
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,"0"), d = String(now.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

fetch("schedule.json", {cache: "no-store"})
  .then(r => r.json())
  .then(data => {
    document.getElementById("groupName").textContent = data.group;
    document.title = "Расписание — " + data.group;
    const gen = new Date(data.generated_at);
    document.getElementById("meta").textContent =
      "обновлено: " + gen.toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});

    const byDate = {};
    for (const l of data.lessons) {
      (byDate[l.date] ||= []).push(l);
    }
    const dates = Object.keys(byDate).sort();
    const today = todayIso();

    const main = document.getElementById("main");
    main.innerHTML = "";

    if (dates.length === 0) {
      main.innerHTML = '<div class="placeholder">Занятий не найдено</div>';
      return;
    }

    for (const date of dates) {
      if (date < today) continue; // показываем только сегодня и будущее
      const lessons = byDate[date].sort((a,b) => a.time.localeCompare(b.time, undefined, {numeric:true}));
      const { label, weekday } = fmtDate(date);

      const dayEl = document.createElement("div");
      dayEl.className = "day" + (date === today ? " today" : "");

      const head = document.createElement("div");
      head.className = "day-head";
      head.innerHTML = `<span>${label}</span><span class="wd">${weekday}${date===today ? " · сегодня" : ""}</span>`;
      dayEl.appendChild(head);

      if (lessons.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-day";
        empty.textContent = "Пар нет";
        dayEl.appendChild(empty);
      } else {
        for (const l of lessons) {
          const row = document.createElement("div");
          row.className = "lesson";
          row.innerHTML = `
            <div class="time">${l.time}</div>
            <div class="info">
              <div class="subj">${l.subject}</div>
              <div class="sub">${[l.room, l.teacher].filter(Boolean).join(" · ")}</div>
            </div>`;
          dayEl.appendChild(row);
        }
      }
      main.appendChild(dayEl);
    }
  })
  .catch(err => {
    document.getElementById("main").innerHTML =
      '<div class="placeholder">Не удалось загрузить расписание: ' + err + '</div>';
  });
</script>
</body>
</html>
